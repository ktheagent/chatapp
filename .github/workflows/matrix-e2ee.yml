name: Matrix E2EE Acceptance

on:
  push:
    paths:
      - "apps/web/**"
      - "infrastructure/**"
      - ".github/workflows/matrix-e2ee.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "infrastructure/**"
      - ".github/workflows/matrix-e2ee.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2ee:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Matrix client dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Create Synapse data volume
        run: docker volume create relay-synapse-e2ee

      - name: Generate Synapse configuration
        run: |
          docker run --rm \
            -v relay-synapse-e2ee:/data \
            -e SYNAPSE_SERVER_NAME=localhost \
            -e SYNAPSE_REPORT_STATS=no \
            matrixdotorg/synapse:v1.158.0 generate

      - name: Enable CI-only shared-secret registration
        run: |
          docker run --rm \
            -v relay-synapse-e2ee:/data \
            alpine:3.22 \
            sh -c "printf '\nregistration_shared_secret: relay-ci-registration-secret\n' >> /data/homeserver.yaml"

      - name: Start Synapse
        run: |
          docker run -d --name relay-synapse-e2ee-server \
            -v relay-synapse-e2ee:/data \
            -p 8008:8008 \
            matrixdotorg/synapse:v1.158.0

      - name: Wait for Matrix client API
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8008/_matrix/client/versions > versions.json; then
              cat versions.json
              exit 0
            fi
            sleep 1
          done
          docker logs relay-synapse-e2ee-server
          exit 1

      - name: Create Alice and Bob test accounts
        id: accounts
        env:
          TEST_PASSWORD: RelayCi-Only-Password-42!
        shell: bash
        run: |
          set +e

          docker exec relay-synapse-e2ee-server register_new_matrix_user \
            http://localhost:8008 \
            -c /data/homeserver.yaml \
            -u alice \
            -p "$TEST_PASSWORD" \
            --no-admin > alice-output.txt 2>&1
          alice_code=$?

          docker exec relay-synapse-e2ee-server register_new_matrix_user \
            http://localhost:8008 \
            -c /data/homeserver.yaml \
            -u bob \
            -p "$TEST_PASSWORD" \
            --no-admin > bob-output.txt 2>&1
          bob_code=$?

          {
            echo "=== Alice registration ==="
            cat alice-output.txt
            echo
            echo "=== Bob registration ==="
            cat bob-output.txt
            echo
            echo "alice_exit=$alice_code"
            echo "bob_exit=$bob_code"
          } | tee account-output.txt

          printf '{"aliceExit":%s,"bobExit":%s}\n' "$alice_code" "$bob_code" > account-result.json

          {
            echo "## Matrix account creation"
            echo '```text'
            cat account-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          test "$alice_code" -eq 0
          test "$bob_code" -eq 0

      - name: Exchange and decrypt a real encrypted message
        id: e2ee_test
        working-directory: apps/web
        env:
          MATRIX_BASE_URL: http://127.0.0.1:8008
          MATRIX_TEST_PASSWORD: RelayCi-Only-Password-42!
          E2EE_RESULT_FILE: e2ee-result.json
        shell: bash
        run: |
          set +e
          node tests/e2ee-smoke.mjs > e2ee-output.txt 2>&1
          code=$?
          cat e2ee-output.txt
          {
            echo "## E2EE acceptance diagnostics"
            echo
            echo "**Exit code:** $code"
            echo
            echo '```text'
            cat e2ee-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Show Synapse logs on failure
        if: failure()
        shell: bash
        run: |
          docker logs relay-synapse-e2ee-server > synapse-output.txt 2>&1 || true
          tail -n 120 synapse-output.txt

      - name: Publish sanitized E2EE result to repository
        if: always() && github.event_name == 'push'
        env:
          ACCOUNTS_OUTCOME: ${{ steps.accounts.outcome }}
          E2EE_OUTCOME: ${{ steps.e2ee_test.outcome }}
        shell: bash
        run: |
          mkdir -p ci

          if [ -f apps/web/e2ee-result.json ]; then
            cp apps/web/e2ee-result.json ci/e2ee-last-result.json
          else
            python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          result = {
              "ok": False,
              "stage": "pre-test-result",
              "accountsOutcome": os.environ.get("ACCOUNTS_OUTCOME", "unknown"),
              "e2eeOutcome": os.environ.get("E2EE_OUTCOME", "unknown"),
          }

          account_path = Path("account-result.json")
          if account_path.exists():
              result["accountResult"] = json.loads(account_path.read_text())

          output_path = Path("apps/web/e2ee-output.txt")
          if output_path.exists():
              text = output_path.read_text(errors="replace")
              text = text.replace("RelayCi-Only-Password-42!", "[redacted]")
              text = re.sub(r'(?i)(access[_-]?token["=: ]+)[^\s,"}]+', r'\1[redacted]', text)
              lines = [line[:500] for line in text.splitlines() if line.strip()]
              result["startupOutputTail"] = lines[-20:]

          Path("ci/e2ee-last-result.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          PY
          fi

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("ci/e2ee-last-result.json")
          data = json.loads(p.read_text())
          data["accountsOutcome"] = os.environ.get("ACCOUNTS_OUTCOME", data.get("accountsOutcome", "unknown"))
          data["e2eeOutcome"] = os.environ.get("E2EE_OUTCOME", data.get("e2eeOutcome", "unknown"))
          data["sourceCommit"] = os.environ["GITHUB_SHA"]
          data["workflowRun"] = os.environ["GITHUB_RUN_ID"]
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY

          git config user.name "relay-ci"
          git config user.email "relay-ci@users.noreply.github.com"
          git add ci/e2ee-last-result.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Record Matrix E2EE CI result [skip ci]"
          git push origin HEAD:main
